<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my magic word lab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{
            background: lightyellow;
        }
        h1 ,h3{
            color: darkorange;
        }
        .box{
            background: white; 
            color: darkorange;
        }
    </style>
</head>
<body>
    <div class="container py-4">
     <h1 class="mb-1">My Magic Word Lab</h1>
     <p class="text-muted mb-4">Discover types, switch them, find and swap words ,catch sneaky errors</p>
     <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">What Type is it?</h3>
            <button class="btn btn-warning" onclick="checktypes()">reveal the type</button>
            <div id="typeResult" class="box p-3 mt-3 rounded">press the button to reveal the secret types</div>
        </div>
     </div>    
     <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">switch the type</h3>
            <input id="numIn" class="form-control mb-2" placeholder="type any thing here">
            <button class="btn btn-warning mr-2" onclick="tostr()">turn into text</button>
            <button class="btn btn-warning mr-2" onclick="tostr()">turn into Number</button>
        </div>
     </div>
    </div>
</body>
</html>
